name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

env:
  EVAL_THRESHOLD: "0.70"

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        # TODO 1: Viet lenh de chay pytest tren thu muc tests/ voi co -v
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  #
  # Luu tru: DVC remote la ./dvcstore ngay trong repo, model va metrics di qua
  # GitHub Actions artifacts. Toan bo pipeline khong can tai khoan cloud nao.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}
      prev_accuracy: ${{ steps.prev_metrics.outputs.prev_accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        # TODO 2: Xac thuc voi noi luu tru du lieu.
        # DVC remote la mot thu muc trong repo (./dvcstore) nen khong can
        # credentials. Buoc nay chi xac nhan cau hinh remote da dung.
        run: |
          dvc remote list
          dvc config core.remote

      - name: Restore previous metrics
        # Bonus 4: lay metrics.json cua lan chay truoc tu GitHub Actions cache.
        # Phai lam TRUOC khi train, neu khong se doc lai chinh ket qua vua tao.
        uses: actions/cache/restore@v4
        with:
          path: .prev_metrics
          key: metrics-${{ github.run_id }}
          restore-keys: |
            metrics-

      - name: Read previous accuracy
        id: prev_metrics
        # Lan chay dau tien chua co cache -> prev_accuracy de trong, khong la loi.
        run: |
          if [ -f .prev_metrics/metrics.json ]; then
            PREV=$(python -c "import json; print(json.load(open('.prev_metrics/metrics.json'))['accuracy'])")
            echo "prev_accuracy=$PREV" >> $GITHUB_OUTPUT
            echo "Tim thay model truoc, accuracy=$PREV"
          else
            echo "prev_accuracy=" >> $GITHUB_OUTPUT
            echo "Chua co model truoc - bo qua so sanh."
          fi

      - name: Pull data with DVC
        # TODO 3: Pull cac file du lieu can thiet tu remote bang lenh dvc pull.
        #         Chi pull train_phase1.csv va eval.csv (khong can train_phase2.csv).
        run: |
          dvc pull data/train_phase1.csv data/eval.csv
          wc -l data/train_phase1.csv data/eval.csv

      - name: Train model
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        # TODO 4: Doc gia tri "accuracy" tu outputs/metrics.json bang Python inline.
        #         Set ket qua thanh output "accuracy" de job deploy co the doc.
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT
          echo "Accuracy doc duoc: $ACC"

      - name: Show performance report
        # Bonus 3: in confusion matrix + precision/recall vao log pipeline.
        run: cat outputs/report.txt

      - name: Upload model to storage
        # TODO 5: Day model len noi luu tru de job deploy va lan chay sau dung lai.
        #         Dung GitHub Actions artifacts (mien phi, khong can tai khoan cloud).
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: models/model.pkl
          retention-days: 30

      - name: Save metrics as artifact
        # Bonus 3: luu ca report.txt canh metrics.json.
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: |
            outputs/metrics.json
            outputs/report.txt

      - name: Cache metrics for next run
        # Bonus 4: ghi metrics moi vao cache de lan chay sau so sanh duoc.
        run: |
          mkdir -p .prev_metrics
          cp outputs/metrics.json .prev_metrics/metrics.json

      - uses: actions/cache/save@v4
        with:
          path: .prev_metrics
          key: metrics-${{ github.run_id }}


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # Kiem tra nguong chat luong (accuracy >= 0.70) va so sanh voi model truoc.
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        # TODO 6: Doc accuracy tu output cua job train.
        #         Neu accuracy < 0.70, ket thuc voi loi ro rang.
        # Bonus 4: ngoai nguong tuyet doi, con chan deploy neu model moi te hon
        #          model dang chay.
        env:
          ACC: ${{ needs.train.outputs.accuracy }}
          PREV_ACC: ${{ needs.train.outputs.prev_accuracy }}
        run: |
          python - <<'EOF'
          import os

          acc = float(os.environ["ACC"])
          threshold = float(os.environ["EVAL_THRESHOLD"])
          prev_raw = os.environ.get("PREV_ACC", "").strip()

          print(f"Accuracy moi : {acc:.4f}")
          print(f"Nguong       : {threshold}")

          failures = []

          # Cong 1: nguong chat luong tuyet doi
          if acc < threshold:
              failures.append(f"accuracy {acc:.4f} < nguong {threshold}")

          # Cong 2 (Bonus 4): khong duoc kem hon model dang chay
          if prev_raw:
              prev = float(prev_raw)
              print(f"Accuracy cu  : {prev:.4f}  (thay doi: {acc - prev:+.4f})")
              if acc < prev:
                  failures.append(f"accuracy {acc:.4f} thap hon model dang chay {prev:.4f}")
          else:
              print("Accuracy cu  : chua co (day la lan chay dau tien)")

          if failures:
              print("\nFAILED: huy deploy vi " + "; ".join(failures) + ".")
              raise SystemExit(1)

          print("\nPASSED: dang trien khai model.")
          EOF


  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # Trien khai va xac nhan endpoint tra ve ket qua dung.
  # Chi chay khi Job 3 (Eval) hoan thanh thanh cong.
  #
  # Neu co secret VM_HOST -> deploy len VM that qua SSH (kien truc goc cua lab).
  # Neu chua co VM -> khoi dong FastAPI ngay tren runner va goi /health + /predict
  # de chung minh duong serving hoat dong dau-cuoi.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      - name: Check VM secrets
        id: check_vm
        run: |
          if [ -n "${{ secrets.VM_HOST }}" ]; then
            echo "has_vm=true" >> $GITHUB_OUTPUT
            echo "Co VM_HOST - deploy len VM qua SSH."
          else
            echo "has_vm=false" >> $GITHUB_OUTPUT
            echo "Chua co VM_HOST - xac minh serving tren runner."
          fi

      # --- Duong 1: VM that qua SSH ---
      - name: SSH deploy to VM
        if: steps.check_vm.outputs.has_vm == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # TODO 7: Restart service mlops-serve tren VM.
            sudo systemctl restart mlops-serve

            # TODO 8: Cho server san sang roi goi curl /health de xac nhan.
            for i in $(seq 1 12); do
              if curl -sf http://localhost:8000/health; then
                echo ""
                echo "Health check passed (lan thu $i)."
                exit 0
              fi
              echo "Chua san sang, thu lai sau 5s... ($i/12)"
              sleep 5
            done
            echo "Health check that bai sau 12 lan thu."
            sudo journalctl -u mlops-serve -n 50 --no-pager
            exit 1

      # --- Duong 2: xac minh serving tren runner ---
      - uses: actions/checkout@v4
        if: steps.check_vm.outputs.has_vm == 'false'

      - uses: actions/setup-python@v5
        if: steps.check_vm.outputs.has_vm == 'false'
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        if: steps.check_vm.outputs.has_vm == 'false'
        run: pip install -r requirements.txt

      - name: Download model
        if: steps.check_vm.outputs.has_vm == 'false'
        uses: actions/download-artifact@v4
        with:
          name: model
          path: models

      - name: Start FastAPI server
        if: steps.check_vm.outputs.has_vm == 'false'
        run: |
          nohup python -m uvicorn src.serve:app --host 127.0.0.1 --port 8000 \
            > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid
          sleep 2
          # Neu port bi chiem, uvicorn chet ngay ma curl van co the trung mot
          # service khac dang lang nghe -> health check "pass" gia. Kiem tra
          # process cua chinh minh con song truoc khi tin ket qua curl.
          if ! kill -0 "$(cat uvicorn.pid)" 2>/dev/null; then
            echo "Server chet ngay khi khoi dong:"
            cat uvicorn.log
            exit 1
          fi

      - name: Health check
        # TODO 8: Cho server san sang roi goi /health de xac nhan.
        if: steps.check_vm.outputs.has_vm == 'false'
        run: |
          for i in $(seq 1 12); do
            if curl -sf http://127.0.0.1:8000/health; then
              echo ""
              echo "Health check passed (lan thu $i)."
              exit 0
            fi
            if ! kill -0 "$(cat uvicorn.pid)" 2>/dev/null; then
              echo "Server da chet. Log uvicorn:"
              cat uvicorn.log
              exit 1
            fi
            echo "Chua san sang, thu lai sau 5s... ($i/12)"
            sleep 5
          done
          echo "Health check that bai sau 12 lan thu. Log uvicorn:"
          cat uvicorn.log
          exit 1

      - name: Verify prediction endpoint
        if: steps.check_vm.outputs.has_vm == 'false'
        run: |
          dvc pull data/eval.csv
          python - <<'EOF'
          import json, urllib.request
          import pandas as pd

          ev = pd.read_csv("data/eval.csv")
          ok = 0
          for i in range(5):
              row = ev.drop(columns=["target"]).iloc[i].tolist()
              req = urllib.request.Request(
                  "http://127.0.0.1:8000/predict",
                  data=json.dumps({"features": row}).encode(),
                  headers={"Content-Type": "application/json"},
              )
              out = json.loads(urllib.request.urlopen(req).read())
              truth = int(ev["target"].iloc[i])
              hit = "dung" if out["prediction"] == truth else "sai"
              print(f"mau {i}: du doan={out['prediction']} ({out['label']:<11}) "
                    f"nhan that={truth}  -> {hit}")
              assert out["prediction"] in (0, 1, 2)
              assert out["label"] in ("thap", "trung_binh", "cao")
              ok += out["prediction"] == truth

          # Kiem tra endpoint tu choi dau vao sai so luong dac trung
          req = urllib.request.Request(
              "http://127.0.0.1:8000/predict",
              data=json.dumps({"features": [1.0, 2.0, 3.0]}).encode(),
              headers={"Content-Type": "application/json"},
          )
          try:
              urllib.request.urlopen(req)
              raise SystemExit("FAILED: endpoint khong tu choi dau vao 3 dac trung.")
          except urllib.error.HTTPError as e:
              assert e.code == 400, f"mong doi 400, nhan {e.code}"
              print("\nValidation OK: 3 dac trung -> HTTP 400.")

          print(f"Endpoint hoat dong dung. Du doan chinh xac {ok}/5 mau.")
          EOF

      - name: Stop server
        if: always() && steps.check_vm.outputs.has_vm == 'false'
        run: |
          [ -f uvicorn.pid ] && kill "$(cat uvicorn.pid)" || true
