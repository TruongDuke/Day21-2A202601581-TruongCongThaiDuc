name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

env:
  # DagsHub thay cho GCS: vua la DVC remote (S3-compatible) vua la MLflow server.
  # Secrets can tao: DAGSHUB_USER, DAGSHUB_REPO, DAGSHUB_TOKEN
  DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
  DAGSHUB_REPO: ${{ secrets.DAGSHUB_REPO }}
  DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
  EVAL_THRESHOLD: "0.70"

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        # TODO 1: Viet lenh de chay pytest tren thu muc tests/ voi co -v
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}
      prev_accuracy: ${{ steps.prev_metrics.outputs.prev_accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        # TODO 2: Ghi credentials va set bien moi truong xac thuc.
        # DagsHub dung S3-compatible API: access_key_id = secret_access_key = token.
        # Ghi vao config --local de khong lam ban .dvc/config da commit.
        run: |
          dvc remote modify --local myremote access_key_id  "$DAGSHUB_TOKEN"
          dvc remote modify --local myremote secret_access_key "$DAGSHUB_TOKEN"
          # MLflow tracking tu xa tren DagsHub (Bonus 1)
          echo "MLFLOW_TRACKING_URI=https://dagshub.com/$DAGSHUB_USER/$DAGSHUB_REPO.mlflow" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_USERNAME=$DAGSHUB_USER" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_PASSWORD=$DAGSHUB_TOKEN" >> $GITHUB_ENV

      - name: Pull data with DVC
        # TODO 3: Pull cac file du lieu can thiet tu cloud storage bang lenh dvc pull.
        #         Chi pull train_phase1.csv va eval.csv (khong can train_phase2.csv).
        run: dvc pull data/train_phase1.csv data/eval.csv

      - name: Download previous metrics
        id: prev_metrics
        # Bonus 4: tai metrics.json cua lan chay truoc de so sanh sau khi train.
        # Phai lam TRUOC buoc upload, neu khong se doc lai chinh model vua day len.
        # Lan chay dau tien chua co file -> prev_accuracy de trong, khong coi la loi.
        run: |
          python - <<'EOF' >> $GITHUB_OUTPUT
          import boto3, os, json, sys
          from botocore.exceptions import ClientError

          user, repo, token = (os.environ["DAGSHUB_USER"],
                               os.environ["DAGSHUB_REPO"],
                               os.environ["DAGSHUB_TOKEN"])
          client = boto3.client(
              "s3",
              endpoint_url=f"https://dagshub.com/api/v1/repo-buckets/s3/{user}",
              aws_access_key_id=token,
              aws_secret_access_key=token,
              region_name="us-east-1",
          )
          try:
              obj = client.get_object(Bucket=repo, Key="models/latest/metrics.json")
              prev = json.loads(obj["Body"].read())
              print(f"prev_accuracy={prev['accuracy']}")
              print(f"Tim thay model truoc, accuracy={prev['accuracy']}", file=sys.stderr)
          except ClientError as e:
              print("prev_accuracy=")
              print(f"Chua co model truoc ({e.response['Error']['Code']}) - bo qua so sanh.",
                    file=sys.stderr)
          EOF

      - name: Train model
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        # TODO 4: Doc gia tri "accuracy" tu outputs/metrics.json bang Python inline.
        #         Set ket qua thanh output "accuracy" de job deploy co the doc.
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT
          echo "Accuracy doc duoc: $ACC"

      - name: Show performance report
        # Bonus 3: in bao cao confusion matrix + precision/recall vao log pipeline.
        run: cat outputs/report.txt

      - name: Upload model to Cloud Storage
        # TODO 5: Upload models/model.pkl len <bucket>/models/latest/model.pkl.
        #         DagsHub repo bucket: bucket = ten repo, endpoint = repo-buckets/s3/<user>.
        #         Upload ca metrics.json de lan chay sau so sanh duoc (Bonus 4).
        run: |
          python - <<'EOF'
          import boto3, os

          user, repo, token = (os.environ["DAGSHUB_USER"],
                               os.environ["DAGSHUB_REPO"],
                               os.environ["DAGSHUB_TOKEN"])
          client = boto3.client(
              "s3",
              endpoint_url=f"https://dagshub.com/api/v1/repo-buckets/s3/{user}",
              aws_access_key_id=token,
              aws_secret_access_key=token,
              region_name="us-east-1",
          )
          for local, key in [
              ("models/model.pkl",     "models/latest/model.pkl"),
              ("outputs/metrics.json", "models/latest/metrics.json"),
              ("outputs/report.txt",   "models/latest/report.txt"),
          ]:
              client.upload_file(Filename=local, Bucket=repo, Key=key)
              print(f"Da upload {local} ({os.path.getsize(local)/1e6:.1f} MB) -> {repo}/{key}")
          EOF

      - name: Save metrics as artifact
        # Bonus 3: luu ca report.txt canh metrics.json.
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: |
            outputs/metrics.json
            outputs/report.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # Kiem tra nguong chat luong (accuracy >= 0.70) va so sanh voi model truoc.
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        # TODO 6: Doc accuracy tu output cua job train.
        #         Neu accuracy < 0.70, ket thuc voi loi ro rang.
        # Bonus 4: ngoai nguong tuyet doi, con chan deploy neu model moi te hon
        #          model dang chay.
        env:
          ACC: ${{ needs.train.outputs.accuracy }}
          PREV_ACC: ${{ needs.train.outputs.prev_accuracy }}
        run: |
          python - <<'EOF'
          import os

          acc = float(os.environ["ACC"])
          threshold = float(os.environ["EVAL_THRESHOLD"])
          prev_raw = os.environ.get("PREV_ACC", "").strip()

          print(f"Accuracy moi : {acc:.4f}")
          print(f"Nguong       : {threshold}")

          failures = []

          # Cong 1: nguong chat luong tuyet doi
          if acc < threshold:
              failures.append(f"accuracy {acc:.4f} < nguong {threshold}")

          # Cong 2 (Bonus 4): khong duoc kem hon model dang chay
          if prev_raw:
              prev = float(prev_raw)
              delta = acc - prev
              print(f"Accuracy cu  : {prev:.4f}  (thay doi: {delta:+.4f})")
              if acc < prev:
                  failures.append(f"accuracy {acc:.4f} thap hon model dang chay {prev:.4f}")
          else:
              print("Accuracy cu  : chua co (day la lan chay dau tien)")

          if failures:
              print("\nFAILED: huy deploy vi " + "; ".join(failures) + ".")
              raise SystemExit(1)

          print("\nPASSED: dang trien khai model.")
          EOF


  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Eval) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      - name: Check VM secrets
        id: check_vm
        # Neu chua co VM, job nay bao qua thay vi that bai do (giu pipeline xanh).
        run: |
          if [ -n "${{ secrets.VM_HOST }}" ]; then
            echo "has_vm=true" >> $GITHUB_OUTPUT
          else
            echo "has_vm=false" >> $GITHUB_OUTPUT
            echo "Chua cau hinh secret VM_HOST - bo qua buoc SSH deploy."
          fi

      - name: SSH deploy to VM
        if: steps.check_vm.outputs.has_vm == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # TODO 7: Restart service mlops-serve tren VM.
            sudo systemctl restart mlops-serve

            # TODO 8: Cho server san sang roi goi curl /health de xac nhan.
            for i in $(seq 1 12); do
              if curl -sf http://localhost:8000/health; then
                echo ""
                echo "Health check passed (lan thu $i)."
                exit 0
              fi
              echo "Chua san sang, thu lai sau 5s... ($i/12)"
              sleep 5
            done
            echo "Health check that bai sau 12 lan thu."
            sudo journalctl -u mlops-serve -n 50 --no-pager
            exit 1
